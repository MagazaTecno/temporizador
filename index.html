
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Congregación Paul Harris</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{height:100vh;background:#0b0f14;color:white;overflow:hidden}
#app{display:flex;height:100vh}
.sidebar{width:420px;background:#161b22;padding:20px;overflow-y:auto;border-right:1px solid #30363d}
h1{color:#f5c542;font-size:1.8rem;margin-bottom:18px;line-height:1.1} h1 span{display:block;color:white;font-size:1rem}
.share{width:100%;min-height:56px;border-radius:24px;border:0;background:linear-gradient(135deg,#00e5ff,#00ffa3);color:#071017;font-weight:900;font-size:1rem;margin-bottom:12px;box-shadow:0 12px 30px rgba(0,255,163,.22)}
.panel{display:none;background:#0d1117;border:1px solid rgba(0,229,255,.25);border-radius:18px;padding:12px;margin-bottom:16px;font-size:.85rem;color:#cbd5e1}
.url{display:block;background:#111827;color:#00e5ff;padding:10px;border-radius:12px;margin-top:8px;word-break:break-all}
.card{background:#1f2630;padding:16px;border-radius:22px;margin-bottom:14px;border:1px solid transparent}
.card.active{border-color:#f5c542;box-shadow:0 0 0 2px rgba(245,197,66,.18)}
label{display:block;font-size:.82rem;margin-bottom:6px;opacity:.86}
input,textarea{width:100%;padding:12px;border:0;border-radius:15px;background:#0d1117;color:white;margin-bottom:12px;outline:none}
textarea{min-height:64px;resize:none}
.row{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
button{border:0;border-radius:14px;padding:8px 10px;font-weight:800;cursor:pointer}
.primary{background:#f5c542;color:#111}.danger{background:#c62828;color:white}.dark{background:#2d3748;color:white}
.small{min-width:88px;font-size:.7rem}.wide{min-width:150px;font-size:.7rem}
.add{width:120px;height:38px;margin-left:auto;background:#f4a261;color:#111;display:block}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.tool{background:#2d3748;color:white;font-size:.72rem}
.status{text-align:right;color:#68d391;font-size:.75rem;margin-top:10px}
.viewer{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center;text-align:center}
.clock{position:absolute;top:18px;left:24px;font-size:2.2rem;color:#d1d5db;opacity:.8;font-weight:800}
.fullscreen{position:absolute;top:20px;right:20px;z-index:5;background:#f5c542;color:#111}
.notice{position:absolute;bottom:20px;left:20px;right:20px;padding:12px;background:rgba(245,197,66,.13);border:1px solid rgba(245,197,66,.35);border-radius:16px;color:#f5c542;display:none;z-index:20}
.screen{padding:40px;width:100%}
.topic{font-size:clamp(2rem,5vw,3rem);font-weight:800;overflow-wrap:anywhere;margin-bottom:18px}
.speaker{font-size:clamp(1.4rem,3vw,2rem);opacity:.85;margin-bottom:44px;overflow-wrap:anywhere}
.timer{font-size:clamp(5rem,15vw,12rem);font-weight:900;line-height:.9}
.timer.tick{transform:scale(1.035)}.timer.overtime{color:#ff3b3b;animation:blink .85s infinite}
.warning{margin-top:30px;color:#ff3b3b;font-size:clamp(2rem,5vw,4.6rem);font-weight:900}
.warning.blink{animation:blink .75s infinite}
.message{margin-top:38px;color:#ff3b3b;font-size:clamp(1.8rem,4vw,3rem);font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere}
.fullmsg{position:absolute;inset:0;background:#000;color:#ff3b3b;z-index:10;display:none;align-items:center;justify-content:center;padding:50px;font-size:clamp(3rem,8vw,7rem);font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere}
.final .topic,.final .speaker{display:none}.final .timer{font-size:clamp(7rem,18vw,17rem)}
@keyframes blink{0%,100%{opacity:1;text-shadow:0 0 28px rgba(255,59,59,.95)}50%{opacity:.35;text-shadow:none}}
body.display .sidebar{display:none}body.display #app{display:block}body.display .viewer{width:100vw;height:100vh}body.display .fullscreen{opacity:0;pointer-events:none}
body.clockonly .sidebar{display:none}body.clockonly #app{display:block}body.clockonly .viewer{width:100vw;height:100vh}
body.clockonly .topic,body.clockonly .speaker,body.clockonly .warning,body.clockonly .message,body.clockonly .fullmsg,body.clockonly .fullscreen,body.clockonly .clock{display:none!important}
body.clockonly .timer{font-size:18rem!important;color:white!important;animation:none!important}
@media(max-width:900px){#app{flex-direction:column}.sidebar{width:100%;height:50%;padding:14px}.viewer{height:50%}.timer{font-size:6rem}.small{min-width:82px;font-size:.65rem}.wide{min-width:145px;font-size:.65rem}}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <h1><span>Congregación</span>Paul Harris</h1>
    <button class="share" onclick="copyTodayTopicsLink()">copiar y compartir los temas de hoy</button>
    <div class="panel" id="panel"><b>Enlace para visualizar:</b><span class="url" id="shareUrl">Preparando...</span>Ábralo en otro dispositivo conectado a la misma red local.</div>
    <div id="events"></div>
    <button class="add" onclick="addEvent()">＋ Temas</button>
    <div class="tools"><button class="tool" onclick="openDisplayWindow()">▣ 2ª Pantalla</button><button class="tool" onclick="toggleClockOnly()">◷ Solo Reloj</button></div>
    <div class="status" id="status">Conectando...</div>
  </div>
  <div class="viewer">
    <div class="clock" id="clock">00:00</div>
    <button class="fullscreen" onclick="togglePresentationMode()">⛶ Full Screen</button>
    <div class="notice" id="notice"></div>
    <div class="fullmsg" id="fullMessage"></div>
    <div class="screen" id="screen">
      <div class="topic" id="topic"></div>
      <div class="speaker" id="speaker"></div>
      <div class="timer" id="timer">05:00</div>
      <div class="warning" id="warning"></div>
      <div class="message" id="message">Bienvenidos</div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let events=[],state=null,lastTimer='',display=location.hash==='#display';if(display)document.body.classList.add('display');
socket.on('connect',()=>status('Conectado en red local'));socket.on('disconnect',()=>status('Sin conexión'));
socket.on('state',s=>{state=s;events=s.events||[];apply(s)});
function status(t){let e=document.getElementById('status');if(e)e.innerText=t}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function save(){socket.emit('saveEvents',events)}
function addEvent(){if(events.length>=10)return notice('Máximo 10 temas permitidos.');events.push({id:String(Date.now()+Math.random()),topic:'',speaker:'',time:300,message:''});render();save()}
function upd(id,f,v){let e=events.find(x=>x.id===id);if(e){e[f]=v;save()}}
function time(id,v){let e=events.find(x=>x.id===id);if(e){e.time=Math.max(60,(parseInt(v)||1)*60);save()}}
function del(id){if(state&&state.activeEventId===id&&!confirm('Este tema está en ejecución. ¿Eliminar?'))return;events=events.filter(x=>x.id!==id);render();save()}
function render(){if(display)return;let box=document.getElementById('events');box.innerHTML='';events.forEach((e,i)=>{let mins=Math.max(1,Math.floor(e.time/60)),active=state&&state.activeEventId===e.id;let c=document.createElement('div');c.className='card'+(active?' active':'');c.innerHTML=`<label>Tema ${i+1}</label><input value="${esc(e.topic)}" onchange="upd('${e.id}','topic',this.value)"><label>Orador</label><input value="${esc(e.speaker)}" onchange="upd('${e.id}','speaker',this.value)"><label>Tiempo (minutos)</label><input type="number" min="1" value="${mins}" onchange="time('${e.id}',this.value)"><label>Mensaje</label><textarea onchange="upd('${e.id}','message',this.value)">${esc(e.message)}</textarea><div class="row"><button class="primary small" onclick="socket.emit('start','${e.id}')">▶ Iniciar</button><button class="danger small" onclick="socket.emit('stop')">■ Detener</button><button class="primary small" onclick="socket.emit('continue')">▶ Continuar</button></div><div class="row"><button class="dark small" onclick="socket.emit('messageBelow','${e.id}')">✉ Enviar</button><button class="dark small" onclick="socket.emit('messageFull','${e.id}')">✉ Full</button><button class="dark small" onclick="socket.emit('hideMessage')">✉ Retirar</button></div><div class="row" style="justify-content:space-between"><button class="dark wide" onclick="socket.emit('hideMessage')">✉ Eliminar Mensaje</button><button class="danger wide" onclick="del('${e.id}')">🗑 Eliminar Evento</button></div>`;box.appendChild(c)})}
function apply(s){if(!display)render();let d=s.display||{};txt('topic',d.topic||'');txt('speaker',d.speaker||'');txt('timer',d.timer||'05:00');txt('message',d.message||'');txt('warning',d.warning||'');let timer=document.getElementById('timer');timer.classList.toggle('overtime',!!d.overtime);if(lastTimer!==d.timer){timer.classList.remove('tick');void timer.offsetWidth;timer.classList.add('tick');lastTimer=d.timer}document.getElementById('warning').classList.toggle('blink',!!d.warningMode);document.getElementById('screen').classList.toggle('final',!!d.warningMode);let f=document.getElementById('fullMessage');f.innerText=d.fullMessage||'';f.style.display=d.fullMessageVisible?'flex':'none';document.body.classList.toggle('clockonly',!!s.clockOnly)}
function txt(id,t){document.getElementById(id).innerText=t}
function openDisplayWindow(){window.open(location.origin+'/#display','display','width=1200,height=800')}
function toggleClockOnly(){socket.emit('clockOnly',!document.body.classList.contains('clockonly'))}
async function getDisplayUrl(){try{let r=await fetch('/api/network'),d=await r.json();if(d.displayUrls&&d.displayUrls[0])return d.displayUrls[0]}catch(e){}return location.origin+'/#display'}
async function copyTodayTopicsLink(){let url=await getDisplayUrl();document.getElementById('shareUrl').innerText=url;document.getElementById('panel').style.display='block';try{await navigator.clipboard.writeText(url);notice('Enlace copiado. Péguelo en Safari del segundo dispositivo.')}catch(e){notice('Copie manualmente el enlace mostrado.')}}
async function togglePresentationMode(){document.body.classList.add('display');try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}}
function notice(t){let n=document.getElementById('notice');n.innerText=t;n.style.display='block';clearTimeout(notice.t);notice.t=setTimeout(()=>n.style.display='none',4500)}
function clock(){let n=new Date();document.getElementById('clock').innerText=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}setInterval(clock,1000);clock();
</script>
</body>
</html>
